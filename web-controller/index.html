<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista Board Controller</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #bb86fc;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #b0b0b0;
        }
        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #333;
            border-radius: 4px;
            background-color: #2c2c2c;
            color: #ffffff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 4px;
            background-color: #bb86fc;
            color: #000;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #9965f4;
        }
        .status {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
            min-height: 1.2em;
        }
        .success { color: #03dac6; }
        .error { color: #cf6679; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Vista Board Controller</h1>
        <div class="form-group">
            <label for="ipAddress">TV IP Address</label>
            <input type="text" id="ipAddress" placeholder="e.g., 192.168.1.100">
        </div>
        <div class="form-group">
            <label for="message">Message</label>
            <input type="text" id="message" placeholder="ENTER MESSAGE" maxlength="132">
        </div>
        <button onclick="sendMessage()">Update Display</button>
        <div id="status" class="status"></div>
    </div>

    <script>
        window.onload = function() {
            const savedIp = localStorage.getItem('vistaBoardIp');
            if (savedIp) {
                document.getElementById('ipAddress').value = savedIp;
            }
        };

        function sendMessage() {
            const ipInput = document.getElementById('ipAddress').value.trim();
            const message = document.getElementById('message').value.toUpperCase();
            const statusDiv = document.getElementById('status');

            if (!ipInput) {
                showStatus('Please enter an IP address', 'error');
                return;
            }

            localStorage.setItem('vistaBoardIp', ipInput);

            // Construct full URL with port 8080 if not present
            let url = ipInput;
            if (!url.startsWith('http')) {
                url = 'http://' + url;
            }
            if (url.split(':').length < 3) {
                 url += ':8080';
            }
            url += '/update-message';

            statusDiv.textContent = 'Sending...';
            statusDiv.className = 'status';

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ text: message })
            })
            .then(response => {
                if (response.ok) {
                    showStatus('Message Sent Successfully!', 'success');
                } else {
                    showStatus('Error: ' + response.statusText, 'error');
                }
            })
            .catch(error => {
                showStatus('Connection Failed: ' + error.message, 'error');
                console.error('Error:', error);
            });
        }

        function showStatus(text, type) {
            const div = document.getElementById('status');
            div.textContent = text;
            div.className = 'status ' + type;
            setTimeout(() => {
                div.textContent = '';
                div.className = 'status';
            }, 5000);
        }
    </script>
</body>
</html>
